# Publishes both builds as one GitHub Pages site:
#   /arpit-portfolio/          the zine
#   /arpit-portfolio/drop-01/  the neo-brutalist DROP 01
# Runs on pushes to main, or on demand from the Actions tab. Nothing is
# published until one of those happens, and Pages must be enabled for the
# repository with "GitHub Actions" as the source.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            drop-01/package-lock.json

      - name: Install the zine
        run: npm ci

      - name: Build the zine to the site root
        run: npx vite build --base=/arpit-portfolio/ --outDir dist-site --emptyOutDir

      - name: Install DROP 01
        run: npm ci
        working-directory: drop-01

      - name: Build DROP 01 to /drop-01/
        run: npx vite build --base=/arpit-portfolio/drop-01/ --outDir ../dist-site/drop-01 --emptyOutDir
        working-directory: drop-01

      # Reads the repository's Pages configuration. It cannot create one:
      # enabling Pages needs admin rights the Actions token never has, so
      # Settings → Pages → Source must be set to "GitHub Actions" once, by
      # the repository owner. Until then this step stops the run.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
